<!DOCTYPE html>
<html lang="pt-br" class="crt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Score - Whack-a-Mole</title>
    <link rel="stylesheet" href="style_jogo.css">
    <link rel="icon" href="imagens/topeira_capacete.png">
    <style>
        .score-container {
            max-width: 500px;
            margin: 60px auto;
            background-color: #0D0221;
            border: 4px solid #B968F2;
            box-shadow: 0 0 20px #B968F2, inset 0 0 15px rgba(185, 104, 242, 0.2);
            padding: 40px;
            text-align: center;
        }

        .score-container h1 {
            color: #C4157A;
            font-size: 22px;
            margin-bottom: 40px;
            text-shadow: 0 0 10px #C4157A;
        }

        .score-bloco {
            background-color: #1A0B3D;
            border: 2px solid #C4157A;
            padding: 20px;
            margin-bottom: 25px;
        }

        .score-titulo {
            color: #B968F2;
            font-size: 12px;
            margin-bottom: 15px;
        }

        .score-valor {
            color: #FFD233;
            font-size: 24px;
            text-shadow: 0 0 10px #FFD233;
        }
    </style>
</head>
<body>

   
    <header class="header">
        <div class="nav-controles">
            <a href="main_menu.html" class="btn-topo">&lt; MENU PRINCIPAL</a>
        </div>
        <div class="pontDiv">
            <a href="selecao_2.html" class="btn-topo" style="border-color:#B968F2; color:#B968F2;">JOGAR NOVAMENTE &gt;</a>
        </div>
    </header>
    <main>
        <div class="score-container">
            <h1>MEU SCORE</h1>

            <div class="score-bloco">
                <div class="score-titulo">ÚLTIMA PARTIDA</div>
                <div class="score-valor" id="ultima-pontuacao">0</div>
            </div>

            <div class="score-bloco">
                <div class="score-titulo">RECORDE PESSOAL</div>
                <div class="score-valor" id="recorde-pontuacao" style="color: #39FF14; text-shadow: 0 0 10px #39FF14;">0</div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const elUltima = document.getElementById('ultima-pontuacao');
            const elRecorde = document.getElementById('recorde-pontuacao');

            // Lê do armazenamento local do navegador
            const ultima = localStorage.getItem('ultimaPontuacao') || '0';
            const recorde = localStorage.getItem('recordePontuacao') || '0';

            
            if (elUltima) elUltima.textContent = ultima;
            if (elRecorde) elRecorde.textContent = recorde;
        });
    </script>

</body>
</html>
