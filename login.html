<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acerte a Toupeira - Login</title>
    <link rel="stylesheet" href="style_login_cadastro.css">
	<link rel="icon" href="imagens/topeira_capacete.png">
</head>
<body>

    <!-- Ícone de Edição de Perfil no canto superior direito -->
    <a href="edicao.html" class="icon-edicao" title="Editar Perfil">⚙️</a>

    <div class="ui-container">
        <h1>ACERTE A<br>TOUPEIRA</h1>
        
        <!-- Correção: A tag form agora envolve os inputs corretamente -->
        <form action="main_menu.html">
            <div class="form-group">
                <label for="login">USUARIO OU EMAIL</label>
                <input type="text" id="login" name="login" required>
            </div>
            
            <div class="form-group">
                <label for="senha">SENHA</label>
                <input type="password" id="senha" name="senha" required>
            </div>

            <button type="submit" class="btn-primary">START</button>
        </form>

        <a href="cadastro.html" class="link">NOVO JOGADOR? REGISTE-SE</a>

        <a href="titulo.html" class="link">SAIR</a>
    </div>

</body>
</html>
