<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="layout_ranking.css">
	<link rel="stylesheet" href="style.css">
	<link rel="icon" href="imagens/topeira_capacete.png">
	<title>Ranking global</title>
</head>
<body>
    <div class="conteiner">
        <div class="menu">
            <a href="main_menu.html" class="a">ACERTE A TOUPEIRA</a>
            <div class="lineBottom"></div>
        </div>
        <header>
            <div class="line"></div>
            <h1>RANKING GLOBAL</h1>
            <div class="line"></div>
        </header>
        <main>
            <div class="filtroDificuldade">
                <h2>DIFICULDADE:</h2>
                <button type="button">FÁCIL</button>
                <button type="button">MÉDIO</button>
                <button type="button">DIFÍCIL</button>
            </div>
            <div class="filtroModo">
                <h2>MODO:</h2>
                <button type="button">NORMAL</button>
                <button type="button">EXPLOSIVO</button>
            </div>
            <div class="divTable">
                <table class="rankTable">
                    <thead>
                        <tr>
                            <th>Pos</th>
                            <th>Usuário</th>
                            <th>Pontuação</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>SAL</td>
                            <td>3600</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</body>
</html>
