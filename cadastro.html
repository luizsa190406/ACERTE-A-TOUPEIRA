<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acerte a Topeira - Login</title>
    <link rel="stylesheet" href="style_login_cadastro.css">
	<link rel="icon" href="imagens/topeira_capacete.png">
    <style>
        .ui-container {
            max-width: 700px; 
            margin-top: 30px;
            margin-bottom: 30px;
        }
        .erro-senha {
            margin-top: 8px;
            font-family: 'Press Start 2P', cursive;
            font-size: 8px;
            line-height: 1.5;
            color: #FF4D6D;
            text-shadow: 0 0 5px #FF4D6D;
        }
        .grid-2-cols {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
    </style>
</head>
<body>

    <div class="ui-container">
        <h1>NOVO JOGADOR</h1>
        
        <form action="login.html" id="formCadastro">
            <div class="form-group">
                <label for="nome">NOME COMPLETO</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="grid-2-cols">
                <div class="form-group">
                    <label for="username">NOME DE USUARIO</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="nascimento">DATA DE NASC.</label>
                    <input type="date" id="nascimento" name="nascimento" required>
                </div>
            </div>

            <div class="grid-2-cols">
                <div class="form-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="000.000.000-00" required>
                </div>
                <div class="form-group">
                    <label for="telefone">TELEFONE</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="11 999999999" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">E-MAIL</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="foto">FOTO DE PERFIL (ARQUIVO)</label>
                <input type="file" id="foto" name="foto" accept="image/*">
            </div>

            <div class="grid-2-cols">
                <div class="form-group">
                    <label for="senha">SENHA</label>
                    <input type="password" id="senha" name="senha" required>
                </div>
                <div class="form-group">
                    <label for="confirma_senha">CONFIRMAR SENHA</label>
                    <input type="password" id="confirma_senha" name="confirma_senha" required>
                    <p class="erro-senha" id="erroSenha" role="alert" hidden></p>
                </div>
            </div>

            <button type="submit" class="btn-primary">GRAVAR DADOS</button>
        </form>

        <a href="titulo.html" class="link">VOLTAR</a>
    </div>

    <script src="cadastro.js"></script>
</body>
</html>
