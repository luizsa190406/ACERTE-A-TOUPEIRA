<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Edição de perfil</title>
	<link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="layout_edicao.css">
	<link rel="icon" href="imagens/topeira_capacete.png">
</head>
<body>
    <div class="conteiner">
        <div class="menu">
            <a href="main_menu.html" class="a">ACERTE A TOUPEIRA</a>
            <div class="lineBottom"></div>
        </div>
        <header>
            <span class="line"></span>
            <h1>Alteração de informações</h1>
            <span class="line"></span>
        </header>
        <main>
            <div class="divImg">
                <img src="imagens/fotoPerfil.png" alt="Logo">
            </div>
            <div class="divInfo">
                <p>Nome</p>
                <div class="divUser"><input class="input" type="text" name="name" value=""></div>
                <br>
                <p>Nome de usuário</p>
                <div class="divUser"><input class="input" type="text" name="username" value=""></div>
                <br>
                <p>E-mail</p>
                <div class="divUser"><input class="input" type="email" name="email" value=""></div>
                <br>
                <p>Telefone</p>
                <div class="divUser"><input class="input" type="text" name="phone" value=""></div>
                <br>
                <p>Senha</p>
                <div class="divUser"><input class="input" type="password" name="password" value=""></div>
                <br>
                <a href="titulo.html" class="buttonSave">Confirmar</a>
            </div>
        </main>
    </div>
</body>
</html>
